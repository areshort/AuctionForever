name: Collect auctions

# Every 20 minutes: Blizzard publishes a new snapshot about once an hour, and a run that finds no new
# snapshot changes nothing. Only the schedule or you (Run workflow) can start it.
on:
  schedule:
    - cron: '5,25,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Get previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download data -p state.json.gz -D data || echo "No previous state yet"
          # Safety net: the state as it was before this run, published as state.prev.json.gz (one rolling copy).
          if [ -f data/state.json.gz ]; then cp data/state.json.gz data/state.prev.json.gz; fi
      - name: Collect house 110
        id: collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python collector/collector.py data
      - name: Publish
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Latest auction data" --notes "Updated by the collector. AuctionForeverData.lua is what the add-on reads."
          if [ -f data/state.prev.json.gz ]; then gh release upload data data/state.prev.json.gz --clobber; fi
          gh release upload data data/state.json.gz data/AuctionForeverData.lua --clobber
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without commits; an empty commit every 30 quiet days prevents that.
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the collector schedule active"
            git push
          fi
