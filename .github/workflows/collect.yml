name: Collect auctions

# Every 20 minutes: Blizzard publishes a new snapshot about once an hour, and a run that finds no new
# snapshot changes nothing. Only the schedule or you (Run workflow) can start it.
on:
  schedule:
    - cron: '5,25,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download data -p state.json.gz -D data || echo "No previous state yet"
      - name: Collect house 110
        id: collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python collector/collector.py data
      - name: Publish
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Latest auction data" --notes "Updated by the collector. AuctionForeverData.lua is what the add-on reads."
          gh release upload data data/state.json.gz data/AuctionForeverData.lua --clobber
